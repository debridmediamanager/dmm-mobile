plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.debridmediamanager'
version = '1.0.0'

android {
  namespace "com.debridmediamanager.player"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  def media3 = '1.11.1'
  implementation "androidx.media3:media3-exoplayer:$media3"
  implementation "androidx.media3:media3-ui:$media3"
  // ass-media asks for media3-effect 1.8.0: kept at the same version as the rest of Media3.
  implementation "androidx.media3:media3-effect:$media3"
  // FFmpeg's audio decoders (TrueHD, DTS-HD, E-AC3, AC3, Opus, FLAC) as Media3's FFmpeg extension, built by Jellyfin (GPL-3.0).
  implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1'
  // libass for ASS and SSA subtitles (ISC), drawn over the picture.
  implementation 'io.github.peerless2012:ass-media:0.5.1'
  testImplementation 'junit:junit:4.13.2'
}
