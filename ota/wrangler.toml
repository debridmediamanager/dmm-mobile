name = "dmm-mobile-ota"
main = "worker.ts"
compatibility_date = "2026-11-01"
# Every app has its update URL built in, so neither address may change. ota.debridmediamanager.com works only
# while the zone's Bot Fight Mode stays off: it challenges the app's requests and the free plan cannot exempt
# one host. workers.dev stays for the 0.1.0 test build, which was built with that address.
routes = [{ pattern = "ota.debridmediamanager.com", custom_domain = true }]
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "OTA"
id = "08e06b1d45be471294a21aa779c2edc4"
